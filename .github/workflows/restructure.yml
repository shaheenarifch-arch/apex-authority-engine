name: One-time restructure (delete after use)

# Runs once on the wire-rambo branch: unpacks apex-tree.tar.gz (the restored folder layout),
# removes the flat uploaded copies, and commits. Delete this file before merging.
on:
  push:
    branches: [wire-rambo]

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack restored layout
        run: |
          if [ ! -f apex-tree.tar.gz ]; then echo "Nothing to unpack"; exit 0; fi
          while IFS= read -r f; do [ -n "$f" ] && git rm -q --ignore-unmatch -- "$f"; done <<'LIST'
          approve.ps1
          daily-authority.yml
          daily.ts
          download
          download (1)
          download (14)
          download (2)
          download (3)
          download (4)
          download (5)
          download (6)
          download (7)
          env.example
          files.ts
          index (10).ts
          index (11).ts
          index (12).ts
          index (13).ts
          index (8).ts
          index (9).ts
          index.ts
          optimizer.test.ts
          planner.test.ts
          preview.ts
          publish-approved.ts
          sites.json
          status.ts
          topics.json
          types.ts
          LIST
          tar -xzf apex-tree.tar.gz
          git rm -q apex-tree.tar.gz
          git add -A -- . ':!.github'
          git config user.name "APEX Authority Engine"
          git config user.email "apex@getservices.ai"
          git commit -m "Restore folder layout, wire RAMBO gateway, fix typecheck and tests"
          git push
